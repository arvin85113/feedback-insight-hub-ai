services:
  - type: web
    name: feedback-insight-hub
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "python -m gunicorn config.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ANALYSIS_READ_PUBLISHED_ONLY
        value: true
