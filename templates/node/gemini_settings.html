{% extends "feedback/dashboard_base.html" %}
{% block dashboard_content %}
<section class="manager-panel">
  <h2>Gemini 金鑰</h2>
  <p>只存 Windows 憑證庫，不存資料庫或 EXE。儲存設定不會呼叫 API。</p>
  {% if credential_error %}<p class="flash-message flash-error">憑證庫無法使用，請檢查 Windows 認證管理員。</p>{% endif %}
  <p>狀態：{% if key_configured %}已設定{% else %}未設定{% endif %}</p>
  <form method="post" class="form-stack">{% csrf_token %}
    <label for="api-key">API 金鑰（不回顯）</label>
    <input id="api-key" name="api_key" type="password" autocomplete="new-password" maxlength="4096">
    <button class="button button-primary" name="action" value="save">儲存至憑證庫</button>
    <button class="button" name="action" value="delete">清除金鑰</button>
  </form>
  <a href="{% url 'node:jobs' %}">前往分析工作</a>
</section>
{% endblock %}
