{% extends "base.html" %}

{% block title %}密碼已更新 | FeedBack IQ{% endblock %}
{% block body_class %}site-body auth-page-public{% endblock %}

{% block content %}
<section class="auth-layout auth-layout-wide">
    <article class="auth-copy">
        <p class="section-kicker">Password Reset</p>
        <h1>密碼已更新。</h1>
        <p>你的登入密碼已完成更新，請使用新密碼重新登入。</p>
    </article>
    <article class="auth-card">
        <div class="panel-head">
            <h2>更新完成</h2>
            <span class="pill">Success</span>
        </div>
        <p>現在可以回到登入頁，使用新密碼進入平台。</p>
        <p class="auth-link-row">
            <a href="{% url 'accounts:login' %}">前往登入</a>
        </p>
    </article>
</section>
{% endblock %}
