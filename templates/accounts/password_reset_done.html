{% extends "base.html" %}

{% block title %}重設信已寄出 | FeedBack IQ{% endblock %}

{% block content %}
<section class="auth-layout auth-layout-wide">
    <article class="auth-card">
        <div class="panel-head">
            <h2>請檢查你的信箱</h2>
            <span class="pill">Email Sent</span>
        </div>
        <p>如果該 Email 對應帳號存在，系統已寄送密碼重設連結。</p>
        <p>請在收到信後點擊連結，設定新密碼。</p>
        <p class="auth-link-row">
            <a href="{% url 'accounts:login' %}">返回登入</a>
        </p>
    </article>
</section>
{% endblock %}
