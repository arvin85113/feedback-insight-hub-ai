{% extends "base.html" %}

{% block title %}修改密碼 | FeedBack IQ{% endblock %}

{% block content %}
<section class="auth-layout auth-layout-wide">
    <article class="auth-card">
        <div class="panel-head">
            <h2>修改密碼</h2>
            <span class="pill">Account Security</span>
        </div>
        <form method="post" class="form-stack">
            {% csrf_token %}
            {% for field in form %}
                <div class="field-block">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit" class="button button-primary button-wide">更新密碼</button>
        </form>
    </article>
</section>
{% endblock %}
