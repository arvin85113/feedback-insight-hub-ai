<html lang="zh-Hant">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="60">
    <title>服務暫時無法使用 | FeedBack IQ</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; color: #1f2933;
               font-family: "Noto Sans TC", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
        main { max-width: 480px; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 8px 24px rgba(15, 23, 42, .08); }
        h1 { font-size: 1.35rem; margin: 0 0 12px; }
        p { line-height: 1.7; margin: 0 0 8px; color: #52606d; }
    </style>
</head>
<body>
<main>
    <h1>資料庫正在喚醒中</h1>
    <p>資料服務暫時無法連線，通常在閒置後重新啟動需要一點時間。已提交的資料不會遺失。</p>
    <p>本頁會在一分鐘後自動重新整理。</p>
</main>

</html>
